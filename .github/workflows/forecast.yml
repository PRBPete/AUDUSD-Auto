name: AUD/USD Hourly Forecast

on:
  schedule:
    # Cron is in UTC. FX market is open Sunday 22:00 UTC to Friday 22:00 UTC.
    # We cover all of that window:
    - cron: "0 22,23 * * 0"      # Sunday evening (market open)
    - cron: "0 * * * 1-4"        # All of Mon-Thu, hourly
    - cron: "0 0-22 * * 5"       # Friday 00:00-22:00 UTC
  workflow_dispatch:             # Allow manual trigger from the Actions tab

permissions:
  contents: write                # Needed to commit logs back to the repo

concurrency:
  # If a run overruns into the next hour, cancel the older one
  group: forecast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forecast
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python audusd_monitor.py

      - name: Commit and push logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No log changes to commit (likely market closed)."
          else
            git commit -m "Hourly forecast update $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Retry push in case another run beat us to it
            for i in 1 2 3; do
              git pull --rebase origin ${{ github.ref_name }} && \
              git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
