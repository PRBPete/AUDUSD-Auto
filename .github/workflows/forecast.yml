name: Hourly Market Forecast

on:
  workflow_dispatch:             # Triggered externally by cron-job.org every hour

permissions:
  contents: read
  actions: write                 # Needed to delete old workflow runs

concurrency:
  group: forecast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # 10 instruments needs a little more headroom

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forecast and send email
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
        run: python audusd_monitor.py

      - name: Delete workflow runs older than 4 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '4 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          echo "Deleting runs created before $CUTOFF"
          gh api "repos/${{ github.repository }}/actions/runs" --paginate \
            --jq ".workflow_runs[] | select(.created_at < \"$CUTOFF\") | .id" \
            | xargs -r -I{} gh api --method DELETE "repos/${{ github.repository }}/actions/runs/{}"
          echo "Cleanup done."
