name: Hourly Market Forecast

on:
  workflow_dispatch:             # Triggered externally by cron-job.org every hour

permissions:
  contents: write                # Needed to push docs/ to GitHub Pages
  actions: write                 # Needed to delete old workflow runs

concurrency:
  group: forecast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forecast and send email
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
        run: python audusd_monitor.py

      - name: Publish report to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No report changes to commit (market likely closed)."
          else
            git commit -m "Hourly report $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull --rebase origin ${{ github.ref_name }} && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      - name: Delete workflow runs older than 4 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '4 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          echo "Deleting runs created before $CUTOFF"
          gh api "repos/${{ github.repository }}/actions/runs" --paginate \
            --jq ".workflow_runs[] | select(.created_at < \"$CUTOFF\") | .id" \
            | xargs -r -I{} gh api --method DELETE "repos/${{ github.repository }}/actions/runs/{}"
          echo "Cleanup done."
