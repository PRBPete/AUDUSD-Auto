name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/FrequencyNoiseApp/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/FrequencyNoiseApp/**"
      - ".github/workflows/android-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/FrequencyNoiseApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frequency-noise-debug-apk
          path: android/FrequencyNoiseApp/app/build/outputs/apk/debug/app-debug.apk
